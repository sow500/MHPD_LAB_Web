<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Client Portal | MHPD Lab</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Libre+Baskerville:wght@400;700&family=Manrope:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="app.css">
</head>
<body>

  <!-- HEADER -->
  <header class="app-header">
    <div class="app-header-inner">
      <a class="app-brand" href="index.html">
        <img src="assets/mhpd-mark.svg" alt="MHPD Lab">
        <span class="app-brand-text">
          <strong>MHPD Lab</strong>
          <small>Client Portal</small>
        </span>
      </a>
      <nav class="app-nav">
        <a href="index.html">Back to Website</a>
      </nav>
    </div>
  </header>

  <!-- AUTH FORMS -->
  <div class="auth-container">
    <div class="auth-card">
      <div class="auth-logo">
        <img src="assets/mhpd-mark.svg" alt="MHPD Lab">
        <span class="auth-logo-text">
          <strong>Client Portal</strong>
          <small>Sign in to manage your tests</small>
        </span>
      </div>

      <!-- Tabs -->
      <div class="auth-tabs">
        <button class="auth-tab active" data-tab="login">Sign In</button>
        <button class="auth-tab" data-tab="register">Register</button>
      </div>

      <!-- Alert -->
      <div id="auth-alert" class="alert"></div>

      <!-- LOGIN FORM -->
      <form id="login-form" class="auth-form active" autocomplete="on">
        <div class="form-group">
          <label class="form-label" for="login-email">Email address</label>
          <input class="form-input" id="login-email" type="email" required autocomplete="email" placeholder="you@company.com">
        </div>
        <div class="form-group">
          <label class="form-label" for="login-password">Password</label>
          <input class="form-input" id="login-password" type="password" required autocomplete="current-password" placeholder="Enter your password">
        </div>
        <button class="btn btn-primary btn-full" type="submit" id="login-btn">Sign In</button>

        <div class="auth-divider">or</div>

        <button class="google-btn" type="button" id="google-login-btn">
          <svg viewBox="0 0 24 24"><path d="M22.56 12.25c0-.78-.07-1.53-.2-2.25H12v4.26h5.92a5.06 5.06 0 0 1-2.2 3.32v2.77h3.57c2.08-1.92 3.28-4.74 3.28-8.1z" fill="#4285F4"/><path d="M12 23c2.97 0 5.46-.98 7.28-2.66l-3.57-2.77c-.98.66-2.23 1.06-3.71 1.06-2.86 0-5.29-1.93-6.16-4.53H2.18v2.84C3.99 20.53 7.7 23 12 23z" fill="#34A853"/><path d="M5.84 14.09a6.97 6.97 0 0 1 0-4.18V7.07H2.18A11.97 11.97 0 0 0 0 12c0 1.94.46 3.77 1.28 5.4l3.56-2.77.01-.54z" fill="#FBBC05"/><path d="M12 5.38c1.62 0 3.06.56 4.21 1.64l3.15-3.15C17.45 2.09 14.97 1 12 1 7.7 1 3.99 3.47 2.18 7.07l3.66 2.84c.87-2.6 3.3-4.53 6.16-4.53z" fill="#EA4335"/></svg>
          Sign in with Google
        </button>
      </form>

      <!-- REGISTER FORM -->
      <form id="register-form" class="auth-form" autocomplete="on">
        <div class="form-row">
          <div class="form-group">
            <label class="form-label" for="reg-name">Full name</label>
            <input class="form-input" id="reg-name" type="text" required autocomplete="name" placeholder="Your full name">
          </div>
          <div class="form-group">
            <label class="form-label" for="reg-phone">Phone number</label>
            <input class="form-input" id="reg-phone" type="tel" required autocomplete="tel" placeholder="+95 9...">
          </div>
        </div>
        <div class="form-group">
          <label class="form-label" for="reg-company">Company / Organization</label>
          <input class="form-input" id="reg-company" type="text" required placeholder="Company name">
        </div>
        <div class="form-group">
          <label class="form-label" for="reg-email">Email address</label>
          <input class="form-input" id="reg-email" type="email" required autocomplete="email" placeholder="you@company.com">
        </div>
        <div class="form-row">
          <div class="form-group">
            <label class="form-label" for="reg-password">Password</label>
            <input class="form-input" id="reg-password" type="password" required autocomplete="new-password" minlength="6" placeholder="Min 6 characters">
          </div>
          <div class="form-group">
            <label class="form-label" for="reg-confirm">Confirm password</label>
            <input class="form-input" id="reg-confirm" type="password" required autocomplete="new-password" placeholder="Repeat password">
          </div>
        </div>
        <button class="btn btn-primary btn-full" type="submit" id="register-btn">Create Account</button>

        <div class="auth-divider">or</div>

        <button class="google-btn" type="button" id="google-register-btn">
          <svg viewBox="0 0 24 24"><path d="M22.56 12.25c0-.78-.07-1.53-.2-2.25H12v4.26h5.92a5.06 5.06 0 0 1-2.2 3.32v2.77h3.57c2.08-1.92 3.28-4.74 3.28-8.1z" fill="#4285F4"/><path d="M12 23c2.97 0 5.46-.98 7.28-2.66l-3.57-2.77c-.98.66-2.23 1.06-3.71 1.06-2.86 0-5.29-1.93-6.16-4.53H2.18v2.84C3.99 20.53 7.7 23 12 23z" fill="#34A853"/><path d="M5.84 14.09a6.97 6.97 0 0 1 0-4.18V7.07H2.18A11.97 11.97 0 0 0 0 12c0 1.94.46 3.77 1.28 5.4l3.56-2.77.01-.54z" fill="#FBBC05"/><path d="M12 5.38c1.62 0 3.06.56 4.21 1.64l3.15-3.15C17.45 2.09 14.97 1 12 1 7.7 1 3.99 3.47 2.18 7.07l3.66 2.84c.87-2.6 3.3-4.53 6.16-4.53z" fill="#EA4335"/></svg>
          Sign up with Google
        </button>
      </form>
    </div>
  </div>

  <script type="module" src="auth.js"></script>
</body>
</html>
