<svg xmlns="http://www.w3.org/2000/svg" viewBox="8 4 184 176" role="img" aria-labelledby="title">
  <title>MHPD Lab logo mark</title>
  <defs>
    <radialGradient id="green" cx="35%" cy="30%" r="70%">
      <stop offset="0%" stop-color="#d5ff67"/>
      <stop offset="55%" stop-color="#7fe326"/>
      <stop offset="100%" stop-color="#2d9e34"/>
    </radialGradient>
    <radialGradient id="blue" cx="35%" cy="30%" r="70%">
      <stop offset="0%" stop-color="#9fd3ff"/>
      <stop offset="55%" stop-color="#356fde"/>
      <stop offset="100%" stop-color="#2532a7"/>
    </radialGradient>
    <radialGradient id="yellow" cx="35%" cy="30%" r="70%">
      <stop offset="0%" stop-color="#fff3a8"/>
      <stop offset="55%" stop-color="#ffd938"/>
      <stop offset="100%" stop-color="#d6a220"/>
    </radialGradient>
    <radialGradient id="red" cx="35%" cy="30%" r="70%">
      <stop offset="0%" stop-color="#ff9682"/>
      <stop offset="55%" stop-color="#dd3b2c"/>
      <stop offset="100%" stop-color="#b3261e"/>
    </radialGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="8" flood-color="#102844" flood-opacity="0.18"/>
    </filter>
  </defs>

  <g filter="url(#shadow)">
    <circle cx="100" cy="48" r="42" fill="url(#green)"/>
    <circle cx="52" cy="131" r="42" fill="url(#blue)"/>
    <circle cx="148" cy="131" r="42" fill="url(#yellow)"/>
  </g>

  <g fill="#f7f8fb" stroke="#d6dce4" stroke-width="2">
    <circle cx="100" cy="87" r="28"/>
    <circle cx="76" cy="129" r="28"/>
    <circle cx="124" cy="129" r="28"/>
  </g>

  <circle cx="100" cy="119" r="22" fill="url(#red)" stroke="#d35b4b" stroke-width="2"/>
</svg>
